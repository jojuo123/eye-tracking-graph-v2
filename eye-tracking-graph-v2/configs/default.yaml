# Example experiment config wiring together every piece of the template with
# the synthetic classification dataset, so the whole pipeline runs out of the box:
#   python main.py --config configs/default.yaml

work_dir: ./work_dir/example_run
seed: 42
device: cuda   # falls back to cpu automatically if CUDA is unavailable
monitor_metric: accuracy
monitor_mode: max
max_checkpoints: 5

model:
  type: mlp_classifier
  in_dim: 32
  hidden_dims: [128, 128]
  num_classes: 10
  dropout: 0.1

data:
  train_dataset:
    type: synthetic_classification
    num_samples: 4000
    in_dim: 32
    num_classes: 10
    seed: 0
  train_loader:
    batch_size: 64
    shuffle: true
    num_workers: 2

  val_dataset:
    type: synthetic_classification
    num_samples: 800
    in_dim: 32
    num_classes: 10
    seed: 1
  val_loader:
    batch_size: 128
    shuffle: false
    num_workers: 2

optimizer:
  type: adamw
  lr: 0.001
  weight_decay: 0.01

scheduler:
  type: cosine
  T_max: 10

trainer:
  type: example_trainer
  num_epochs: 10
  log_interval: 10
  grad_clip_norm: 1.0
