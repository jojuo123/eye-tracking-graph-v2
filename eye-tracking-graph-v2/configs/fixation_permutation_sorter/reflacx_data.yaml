# Shared between `data/reflacx/reflacx.py` (preprocessing) and
# `dataloaders/single_h5_dataset.py` (via `data.reflacx.reflacx.dataset_kwargs`).
#
# `fixations.out_of_bounds`/`coordinate_columns`/`coordinate_bounds` describe what
# *preprocessing* does: `preprocess` applies `apply_out_of_bounds` to each sample's raw
# fixations once, before writing them to H5 and before computing `soft_permutation`
# (`compute_soft_ground_truth`) -- so the stored `fixations` are already clipped/filtered,
# and `soft_permutation` was computed on that same already-handled data (there's no correct
# way to fix this up after the fact for "remove": Sinkhorn normalization is a whole-matrix
# operation, so an out-of-bounds fixation left in at compute time distorts every other row's
# normalization too, not just its own -- see `compute_soft_ground_truth`'s docstring).
# Because of this, `dataset_kwargs` hardcodes the *dataloader's* `out_of_bounds` to
# `"ignore"` regardless of the value here -- by the time a dataset reads the H5 file back,
# there's nothing left to clip or remove. Change this file's `fixations.*` and re-run
# preprocessing to change the actual behavior; changing a dataloader's `out_of_bounds`
# directly only matters when overriding `dataset_kwargs` to read an H5 file that predates
# this preprocessing step.

paths:
  metadata:
    - metadata_phase_1.csv
    - metadata_phase_2.csv
    - metadata_phase_3.csv
  fixations_root: erda2/eye-tracking/physionet.org/files/reflacx-xray-localization/1.0.0/main_data
  metadata_root: erda2/eye-tracking/physionet.org/files/reflacx-xray-localization/1.0.0/main_data
  image_root: erda2/eye-tracking/mimic-cxr-jpg/files
  h5_path: erda2/eye-tracking/normalized_data_softGT.h5

dataset_name: reflacx
removed_metadata_columns: [id, split, eye_tracking_data_discarded, image, dicom_id, subject_id]

image:
  resize: [224, 224]
  normalize_image: true
  image_dtype: float32   # name of a torch dtype, e.g. float32, float16

fixations:
  normalize: true                              # write the *_norm columns load_fixations adds
  fixation_columns: null                       # null = every column present (SingleH5Dataset's default)
  coordinate_columns: [x_position_norm, y_position_norm]
  coordinate_bounds: [0.0, 1.0]                # [min, max] for both axes, or [[x_min,x_max],[y_min,y_max]]
  out_of_bounds: remove                        # ignore | clip | remove

soft_ground_truth:
  enabled: true
  method: sinkhorn                             # sinkhorn | linear_sum_assignment
  columns: [x_position_norm, y_position_norm]
  tau: 1.0
  n_iters: 20
  # Multiplies the (Euclidean) distance map before it's turned into a Sinkhorn score
  # (-distance * scale / tau) -- `columns` are [0, 1]-normalized, so pairwise distances are
  # small (at most sqrt(2)) and at scale=1.0/tau=1.0 barely sharpen Sinkhorn away from a
  # uniform 1/n matrix. Raise this to sharpen the soft ground truth toward a hard
  # permutation. See `visualize_soft_gt_scale.py`.
  scale: 224.0

# Whether a dataset built via `data.reflacx.reflacx.dataset_kwargs` should load the
# precomputed `soft_permutation` matrix (requires `soft_ground_truth.enabled` to have been
# true when the H5 file was written).
load_soft_permutation: true
