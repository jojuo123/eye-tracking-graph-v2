# Shared between `data/reflacx/reflacx.py` (preprocessing) and
# `dataloaders/single_h5_dataset.py` (via `data.reflacx.reflacx.dataset_kwargs`), so both
# sides always agree on where the data lives, what counts as an out-of-bounds fixation, and
# how the soft ground-truth matrix is computed.
#
# This matters because `out_of_bounds`/`coordinate_columns`/`coordinate_bounds` here also
# steer `compute_soft_ground_truth` at preprocessing time: "clip" mode's soft-permutation
# distances must be computed on the same (clamped) coordinates the dataloader will actually
# return, or the precomputed matrix would silently disagree with what a model sees. Change
# `fixations.out_of_bounds` (or the bounds/columns) here and re-run preprocessing to keep
# them in sync -- editing only the dataloader side (or vice versa) re-introduces the mismatch
# this file exists to prevent.

paths:
  metadata:
    - metadata_phase_1.csv
    - metadata_phase_2.csv
    - metadata_phase_3.csv
  fixations_root: erda2/eye-tracking/physionet.org/files/reflacx-xray-localization/1.0.0/main_data
  metadata_root: erda2/eye-tracking/physionet.org/files/reflacx-xray-localization/1.0.0/main_data
  image_root: erda2/eye-tracking/mimic-cxr-jpg/files
  h5_path: erda2/eye-tracking/normalized_data_softGT.h5

dataset_name: reflacx
removed_metadata_columns: [id, split, eye_tracking_data_discarded, image, dicom_id, subject_id]

image:
  resize: [224, 224]
  normalize_image: true
  image_dtype: float32   # name of a torch dtype, e.g. float32, float16

fixations:
  normalize: true                              # write the *_norm columns load_fixations adds
  fixation_columns: null                       # null = every column present (SingleH5Dataset's default)
  coordinate_columns: [x_position_norm, y_position_norm]
  coordinate_bounds: [0.0, 1.0]                # [min, max] for both axes, or [[x_min,x_max],[y_min,y_max]]
  out_of_bounds: ignore                        # ignore | clip | remove

soft_ground_truth:
  enabled: true
  method: sinkhorn                             # sinkhorn | linear_sum_assignment
  columns: [x_position_norm, y_position_norm]
  tau: 1.0
  n_iters: 20

# Whether a dataset built via `data.reflacx.reflacx.dataset_kwargs` should load the
# precomputed `soft_permutation` matrix (requires `soft_ground_truth.enabled` to have been
# true when the H5 file was written).
load_soft_permutation: true
